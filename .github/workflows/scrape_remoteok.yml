name: Archived Job Market Dashboard Check

on:
  # schedule:
  #   # Runs twice per day at 06:00 and 18:00 UTC
  #   - cron: "0 6,18 * * *"
  workflow_dispatch:  # allows manual trigger

jobs:
  # scrape:
  #   runs-on: ubuntu-latest

  validate-dashboard-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dashboard dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas plotly streamlit scikit-learn

      - name: Validate required data files exist
        run: |
          test -f data/processed/data_clean.csv
          test -f data/processed/run_job_info.csv
          test -f data/meta/scrape_runs.csv

      - name: Validate dashboard imports
        run: |
          python -m py_compile app/app.py

