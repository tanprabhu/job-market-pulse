name: Scheduled RemoteOK Scrape v1

on:
  schedule:
    # Runs twice per day at 06:00 and 18:00 UTC
    - cron: "0 6,18 * * *"
  workflow_dispatch:  # allows manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run scraper
        run: |
          python src/scrape_remoteok.py

      - name: Run processing pipeline
        run: |
          python src/process_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Automated scrape and processing" || echo "No changes to commit"
          git push
